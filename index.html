<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC產業週報</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --border: #2d3148; --text: #e2e8f0; --text2: #94a3b8;
  --text3: #64748b; --accent: #6366f1;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 200; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { font-size: 16px; font-weight: 700; color: var(--text); }
.badge { background: var(--accent); color: white; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.meta { font-size: 12px; color: var(--text3); }
.lang-switcher { display: flex; gap: 4px; background: var(--surface2); border-radius: 8px; padding: 3px; }
.lang-btn { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text3); transition: all 0.15s; }
.lang-btn:hover { color: var(--text); }
.lang-btn.active { background: var(--accent); color: white; }
.layout { display: flex; height: calc(100vh - 56px); }
.sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 12px 0; }
.sidebar-section { padding: 6px 16px 4px; font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; font-size: 13px; color: var(--text2); cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; text-decoration: none; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { border-left-color: var(--accent); background: var(--surface2); color: var(--text); }
.nav-pill { background: var(--surface2); border-radius: 10px; padding: 1px 7px; font-size: 11px; color: var(--text3); }
.main { flex: 1; overflow-y: auto; padding: 24px; }
.cat-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.cat-title { font-size: 20px; font-weight: 700; }
.cat-count { font-size: 13px; color: var(--text3); margin-left: auto; }
.subtopic { margin-bottom: 20px; }
.subtopic-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; transition: background 0.15s; }
.subtopic-header:hover { background: var(--surface2); }
.subtopic-header.collapsed { border-radius: 8px; }
.subtopic-name { font-size: 14px; font-weight: 600; flex: 1; }
.subtopic-count { font-size: 12px; color: var(--text3); }
.chevron { font-size: 11px; color: var(--text3); transition: transform 0.2s; }
.chevron.open { transform: rotate(90deg); }
.articles-wrap { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.article { padding: 14px 16px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.article:last-child { border-bottom: none; }
.article:hover { background: var(--surface); }
.article-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.04em; }
.tag-capital { background: #3b1f00; color: #f59e0b; }
.tag-industry { background: #0f2744; color: #60a5fa; }
.outlet-name { font-size: 12px; color: var(--text3); }
.pub-date { font-size: 12px; color: var(--text3); margin-left: auto; }
.article-title { font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; line-height: 1.5; display: block; margin-bottom: 5px; }
.article-title:hover { color: #818cf8; }
.summary { font-size: 13px; color: var(--text2); margin-bottom: 4px; line-height: 1.5; }
.reason { font-size: 12px; color: var(--text3); font-style: italic; }
.empty-state { padding: 20px 16px; font-size: 13px; color: var(--text3); font-style: italic; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text3); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 手機版底部大類導航 ── */
.mobile-cat-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  z-index: 300;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.mobile-cat-nav::-webkit-scrollbar { display: none; }
.mobile-cat-nav-inner {
  display: flex;
  padding: 6px 8px;
  gap: 6px;
  min-width: max-content;
}
.mobile-cat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 12px;
  border-radius: 10px;
  border: none;
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
.mobile-cat-btn.active { background: var(--surface2); }
.mobile-cat-dot { width: 7px; height: 7px; border-radius: 50%; }
.mobile-cat-label { font-size: 11px; font-weight: 600; color: var(--text2); }
.mobile-cat-btn.active .mobile-cat-label { color: var(--text); }
.mobile-cat-count { font-size: 10px; color: var(--text3); }

@media (max-width: 640px) {
  .sidebar { display: none; }
  .main { padding: 12px; padding-bottom: 80px; }
  .meta { display: none; }
  .mobile-cat-nav { display: block; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">📊 <span id="ui-title">IC產業週報</span></span>
    <span class="badge">LIVE</span>
  </div>
  <div class="topbar-right">
    <span class="meta" id="meta-text"></span>
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('zh-TW')">繁</button>
      <button class="lang-btn" onclick="setLang('zh-CN')">简</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('vi')">VI</button>
    </div>
  </div>
</div>

<!-- 手機底部大類導航 -->
<div class="mobile-cat-nav" id="mobile-cat-nav">
  <div class="mobile-cat-nav-inner" id="mobile-cat-inner"></div>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="center"><div class="spinner"></div></div>
  </nav>
  <main class="main" id="main">
    <div class="center"><div class="spinner"></div><span id="ui-loading">正在讀取最新週報...</span></div>

const CAT_COLORS = {

let currentLang = "zh-TW";
let currentCat  = 0;
let data        = null;

function t(key) { return (I18N[currentLang]||I18N["zh-TW"])[key]||key; }
function catName(n) { return (CAT_NAMES[currentLang]||{})[n]||n; }
function subName(n) { return (SUB_NAMES[currentLang]||{})[n]||n; }

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.classList.toggle("active", b.textContent === {"zh-TW":"繁","zh-CN":"简","en":"EN","vi":"VI"}[lang]);
  });
  document.getElementById("ui-title").textContent = t("title");
  document.title = t("title");
  if (data) { updateMeta(); renderSidebar(data); renderMobileCatNav(data); renderCat(currentCat); }
}

function updateMeta() {
  if (!data) return;
  document.getElementById("meta-text").textContent =
    `${t("period")}：${data.week_start} - ${data.week_end}　${t("generated")}：${data.generated_at}`;
}

function renderMobileCatNav(d) {
  const inner = document.getElementById("mobile-cat-inner");
  if (!inner) return;
  inner.innerHTML = d.categories.map((cat, i) => {
    const total = cat.subtopics.reduce((s, sub) => s + (sub.articles ? sub.articles.length : 0), 0);
    const color = CAT_COLORS[cat.name] || "#888";
    return `<button class="mobile-cat-btn${i === currentCat ? " active" : ""}" onclick="showCat(${i})" id="mob-nav-${i}">
      <span class="mobile-cat-dot" style="background:${color}"></span>
      <span class="mobile-cat-label">${catName(cat.name)}</span>
      <span class="mobile-cat-count">${total}</span>
    </button>`;
  }).join("");
}

function renderSidebar(d) {
  document.getElementById("sidebar").innerHTML =
    `<div class="sidebar-section">${t("categories")}</div>` +
    d.categories.map((cat,i) => {
      const total = cat.subtopics.reduce((s,sub)=>s+(sub.articles?sub.articles.length:0),0);
      const color = CAT_COLORS[cat.name]||"#888";
      return `<a class="nav-item${i===currentCat?" active":""}" onclick="showCat(${i})" id="nav-${i}">
        <span style="display:flex;align-items:center;gap:8px">
          <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span>
          ${catName(cat.name)}
        </span>
        <span class="nav-pill">${total}</span>
      </a>`;
    }).join("");
}

function renderCat(catIdx) {
  const cat   = data.categories[catIdx];
  const color = CAT_COLORS[cat.name]||"#888";
  const total = cat.subtopics.reduce((s,sub)=>s+(sub.articles?sub.articles.length:0),0);

  const subtopicsHtml = cat.subtopics.map((sub,si) => {
    const sid = `sub-${catIdx}-${si}`;
    let articlesHtml = "";
    if (!sub.articles||sub.articles.length===0) {
      articlesHtml = `<div class="empty-state">${t("empty")}</div>`;
    } else {
      articlesHtml = sub.articles.map(a => {
        const p = a.perspective||"";
        const isCapital = p.includes("資本")||p.includes("资本")||p.toLowerCase().includes("capital");
        const title   = a[`title_${currentLang}`]  ||a.title  ||"";
        const summary = a[`summary_${currentLang}`]||a.summary||"";
        const reason  = a[`reason_${currentLang}`] ||a.reason ||"";
        return `<div class="article">
          <div class="article-meta">
            <span class="tag ${isCapital?"tag-capital":"tag-industry"}">${isCapital?t("capital"):t("industry")}</span>
            <span class="outlet-name">${a.outlet||""}</span>
            <span class="pub-date">${a.published||""}</span>
          </div>
          <a class="article-title" href="${a.url||'#'}" target="_blank" rel="noopener">${title}</a>
          <p class="summary">${summary}</p>
          <p class="reason">${t("reason")}：${reason}</p>
        </div>`;
      }).join("");
    }
    return `<div class="subtopic">
      <div class="subtopic-header" onclick="toggleSub('${sid}')">
        <span class="chevron open" id="chev-${sid}">▶</span>
        <span class="subtopic-name">${subName(sub.name)}</span>
        <span class="subtopic-count">${sub.articles?sub.articles.length:0} ${t("articles")}</span>
      </div>
      <div class="articles-wrap" id="${sid}">${articlesHtml}</div>
    </div>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="cat-header">
      <span class="cat-dot" style="background:${color}"></span>
      <span class="cat-title">${catName(cat.name)}</span>
      <span class="cat-count">${total} ${t("articles")} · ${cat.subtopics.length} ${t("blocks")}</span>
    </div>${subtopicsHtml}`;
}

function showCat(idx) {
  currentCat = idx;
  document.querySelectorAll(".nav-item").forEach((el,i)=>el.classList.toggle("active",i===idx));
  document.querySelectorAll(".mobile-cat-btn").forEach((el,i)=>el.classList.toggle("active",i===idx));
  const activeBtn = document.getElementById(`mob-nav-${idx}`);
  if (activeBtn) activeBtn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  renderCat(idx);
}

function toggleSub(sid) {
  const wrap   = document.getElementById(sid);
  const chev   = document.getElementById(`chev-${sid}`);
  const header = wrap.previousElementSibling;
  const hidden = wrap.style.display==="none";
  wrap.style.display = hidden?"":"none";
  chev.classList.toggle("open",hidden);
  header.classList.toggle("collapsed",!hidden);
}

async function init() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`${res.status}: ${res.statusText}`);
    data = await res.json();
    updateMeta();
    renderSidebar(data);
    renderMobileCatNav(data);
    renderCat(0);
  } catch(e) {
    document.getElementById("main").innerHTML = `
      <div class="center">
        <span style="font-size:32px">⚠️</span>
        <span style="color:#ef4444;font-weight:600">${t("err")}</span>
        <span style="font-size:13px;max-width:400px;text-align:center">${e.message}</span>
      </div>`;
    document.getElementById("sidebar").innerHTML="";
  }
}

init();
</script>
</body>
</html>
